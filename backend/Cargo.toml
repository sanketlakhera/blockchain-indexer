[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "2.2.0", features = [
    "providers",
    "rpc-types",
    "consensus",
] }
anyhow = "1.0.104"
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = [
    "postgres",
    "macros",
    "chrono",
    "runtime-tokio",
    "tls-rustls",
] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
